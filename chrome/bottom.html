<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>bru bar</title>
        <!-- chrome.css carries the layout and not one colour; theme.css carries
             the colours and not one rule. bru serves theme.css from
             ~/.config/bru/theme.css, so swapping the theme is swapping a file. -->
        <link rel="stylesheet" href="chrome.css" />
        <link rel="stylesheet" href="theme.css" />
        <!-- user.css is bru's own settings that are lengths and names rather than
             colours: the font family, size and weight. Served, not pushed, because the
             four generated bru:// pages wear the same chrome and receive no push. -->
        <link rel="stylesheet" href="user.css" />
    </head>
    <!-- data-view, not a class: bottom.js owns className — it puts the current
         mode there as `mode-normal`, `mode-command`, … — and would overwrite a
         class the layout depended on. -->
    <body data-view="bottom">
        <!-- Empty means closed. #completion:empty is display:none, so the
             document is exactly as tall as the bar until there is something to
             show; that height is what the window layout reads. -->
        <div id="completion"></div>
        <!-- src/prompt.rs: the question bru is waiting on, above the bar and
             above the completion table, where qutebrowser puts its prompt
             container. Empty means nothing is being asked, and
             `#prompt:empty { display: none }` is what takes its height back —
             the same rule #completion follows, and the reason prompt.js clears
             it with textContent = "" rather than with blank markup. -->
        <div id="prompt"></div>
        <!-- One row, like qutebrowser's statusbar: the status group sits on the
             right always, the command line takes the left when the mode is
             command. They are grid-placed, so the row is theirs whichever way
             round the source happens to read. -->
        <!-- Whatever bru has been asked to say — src/message.rs, and src/clip.rs
             through it. Where qutebrowser's message area would be: empty in
             every mode but the seconds after a yank, and #message:empty is
             display:none, so it costs the bar nothing. It shares grid cell 2/1
             with #cmdline, exactly as qutebrowser shares one QStackedLayout slot
             between its cmd and txt widgets (statusbar/bar.py:169), and the two
             never occupy it at once: the command line is hidden outside command
             mode and the message is hidden inside it. So the bar is still one
             row — the line when one is open, the message otherwise, and neither
             when neither.

             ONE of these, not two. There were two, with the same id, and
             getElementById answers with the first: the second was an element
             nothing could ever address and the stylesheet could only ever hide.
             -->
        <div id="message"></div>
        <!-- Which mode the keyboard is in, at the front of the bar and always
             visible, including in normal mode. Asked for 2026-08-07.

             qutebrowser only ever writes "-- INSERT MODE --" into its message
             area, and only for the modes whose parser is passthrough
             (statusbar/bar.py:381-396); everything else it says with colour
             alone. bru says it with both: the bar still recolours, and this
             names the mode in words, because a colour tells you something
             changed and a word tells you what.

             First in the source and first in the grid, so nothing that grows —
             a long URL, an open command line — can push it out of sight. -->
        <div id="mode"></div>
        <!-- qutebrowser's widget order, from `statusbar.widgets`' default in
             configdata.yml:2212 — keypress, search_match, url, scroll, history,
             tabs, progress. bru has no history arrows and no load progress bar,
             so what is left of that list, in that order, is keystring, search,
             url, scroll, tabindex. #download takes progress's place at the end:
             it is not a qutebrowser statusbar widget at all — qutebrowser gives
             downloads a second row of their own — and last is where a widget
             that is usually absent belongs, so its arrival never shifts the four
             fields DESIGN.md names. -->
        <div id="statusline">
            <span id="keystring"></span>
            <span id="search"></span>
            <span id="url"></span>
            <span id="scroll"></span>
            <span id="tabindex"></span>
            <span id="download"></span>
        </div>
        <input id="cmdline" type="text" spellcheck="false" autocomplete="off" />
        <!-- Before bottom.js, which calls into window.bruCompletion and
             window.bruPrompt when it renders. -->
        <script src="completion.js"></script>
        <script src="prompt.js"></script>
        <script src="bottom.js"></script>
    </body>
</html>
