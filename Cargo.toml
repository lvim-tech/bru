[package]
name = "bru"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bru"
path = "src/main.rs"

[dependencies]
# From tauri-apps/cef-rs. The version tracks CEF itself: 151 is the Chromium
# under Brave, which is the whole point of choosing CEF over WebKitGTK.
#
# Nothing here builds Chromium. cef-dll-sys downloads a prebuilt distribution,
# and reuses ~/.local/share/cef when CEF_PATH points at it:
#
#   cargo run -p export-cef-dir -- --force ~/.local/share/cef   (in a cef-rs checkout)
#   export CEF_PATH="$HOME/.local/share/cef"
#   export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$CEF_PATH"
cef = "151.2"

# Reads ~/.config/bru/config.lua at startup and nothing else, ever — see src/config.rs. `vendored`
# builds Lua 5.4 from source so there is no system liblua to keep in step with.
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }

# `~/.local/share/bru/history.sqlite` — see src/data.rs. `bundled` compiles SQLite from source, so
# the schema bru writes cannot drift under it when the system libsqlite3 is upgraded.
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Brave's own ad-blocking engine — see src/adblock.rs. The same engine qutebrowser runs, which
# reaches it through the `python-adblock` binding; bru links it directly, so a request is decided in
# Rust with no FFI in the way. Pure Rust, no C, no build script that fetches anything.
#
# `default-features = false` is not cosmetic. The default set includes `single-thread`, which swaps
# the engine's internal `Arc`/`Mutex` for `Rc`/`RefCell` and makes `Engine` neither `Send` nor
# `Sync` — and the engine is built on a background thread and read from CEF's IO thread. The two
# features named back are the rest of the default set:
#   embedded-domain-resolver  the public-suffix list, so "third party" means what it means in a
#                             browser (ads.example.co.uk is not first party to example.co.uk)
#   full-regex-handling       the regex filters; without it those rules are dropped, silently
adblock = { version = "0.13.2", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }

# Greasemonkey's `/regex/` `@include`/`@exclude` rules — see src/greasemonkey.rs. **This costs no
# build time and no new crate**: `adblock`'s `full-regex-handling` above already depends on
# `regex 1.13.1` with its default features, so cargo compiles exactly the same rlib either way.
# Measured 2026-08-06: `cargo tree --prefix none | sort -u | wc -l` is 149 with this line and 149
# without it.
#
# The engine is deliberately linear-time and has no backreferences and no lookaround, so it is a
# strict subset of the ECMAScript syntax a userscript's rule is written in. That is the right trade
# for a pattern that arrives in a file the user dropped in a directory — a catastrophically
# backtracking `@include` would hang the renderer on every page — and a pattern outside the subset
# is refused *by name, with the reason*, which is what this module already does with everything else
# it cannot honour.
regex = "1.13"

# --- src/theme_watch.rs -------------------------------------------------------------------------
# `inotify_init1`, `inotify_add_watch` and a blocking `read`, so that a theme written under a running
# browser is noticed by the kernel telling bru rather than by bru asking. Already in the tree
# transitively (adblock reaches it through console/indicatif); named here because a direct `use` of a
# crate nobody declared is a dependency that disappears the day the indirect path changes.
libc = "0.2"


# The ad blocker is the one dependency bru runs *per network request*, and unoptimized it is not
# slow, it is unusable. Measured 2026-08-06 against EasyList + EasyPrivacy and the 158 requests
# https://www.vesti.bg/ makes, mean time to decide one request:
#
#   dev, nothing overridden            16663 us   (2.6 s of matcher for one page load)
#   dev, adblock alone at opt-level 3    154 us
#   dev, this block                      128 us
#   release                             4.59 us   (0.72 ms for the same page)
#
# A debug build is what every check in this project runs, so the first line is the one that would
# have been believed. These overrides cost 12 s of first build and nothing afterwards.
[profile.dev.package.adblock]
opt-level = 3
[profile.dev.package.flatbuffers]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.addr]
opt-level = 3
[profile.dev.package.psl]
opt-level = 3
[profile.dev.package.seahash]
opt-level = 3
